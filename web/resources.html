<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Resources - CommunityMatch
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<nav>

    <h2>
        CommunityMatch
    </h2>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="request.html">
            Request Help
        </a>

        <a href="resources.html">
            Resources
        </a>

        <a href="matching.html">
            AI Matching
        </a>

    </div>

</nav>


<div class="form-container">

    <h1>
        Provide a Resource
    </h1>


    <p>
        Add an available resource to help the community.
    </p>


    <form id="resourceForm">

        <label>
            Provider Name
        </label>

        <input
            type="text"
            id="providerName"
            placeholder="Enter provider name"
            required
        >


        <label>
            Category
        </label>

        <select
            id="category"
            required
        >

            <option value="">
                Select category
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Water">
                Water
            </option>

            <option value="Medical">
                Medical
            </option>

            <option value="Shelter">
                Shelter
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>
            Description
        </label>

        <textarea
            id="description"
            placeholder="Describe the available resource"
            required
        ></textarea>


        <label>
            Quantity
        </label>

        <input
            type="number"
            id="quantity"
            min="1"
            placeholder="Enter available quantity"
            required
        >


        <label>
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="Enter resource location"
            required
        >


        <button
            type="button"
            class="btn"
            onclick="getLiveLocation()"
        >
            📍 Use My Live Location
        </button>


        <p id="locationMessage"></p>


        <input
            type="hidden"
            id="latitude"
        >

        <input
            type="hidden"
            id="longitude"
        >


        <button type="submit">
            Add Resource
        </button>

    </form>


    <p id="message"></p>

</div>


<script>

function getLiveLocation() {

    const locationInput =
        document.getElementById("location");

    const locationMessage =
        document.getElementById("locationMessage");


    if (!navigator.geolocation) {

        locationMessage.innerText =
            "❌ Geolocation is not supported by this browser.";

        return;

    }


    locationMessage.innerText =
        "📍 Getting your live location...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            // Store latitude
            document.getElementById(
                "latitude"
            ).value =
                latitude;


            // Store longitude
            document.getElementById(
                "longitude"
            ).value =
                longitude;


            locationMessage.innerText =
                "📍 Finding your location...";


            try {

                const response =
                    await fetch(
                        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to get address"
                    );

                }


                const data =
                    await response.json();


                let address = "";


                // Locality
                if (data.locality) {

                    address =
                        data.locality;

                }


                // City
                if (
                    data.city &&
                    data.city !== data.locality
                ) {

                    address =
                        address
                            ? address + ", " + data.city
                            : data.city;

                }


                // State
                if (data.principalSubdivision) {

                    address =
                        address
                            ? address +
                              ", " +
                              data.principalSubdivision
                            : data.principalSubdivision;

                }


                // Country
                if (data.countryName) {

                    address =
                        address
                            ? address +
                              ", " +
                              data.countryName
                            : data.countryName;

                }


                // Put address inside Location box
                if (address) {

                    locationInput.value =
                        address;


                    locationMessage.innerText =
                        "✅ Live location captured successfully!";

                }

                else {

                    locationInput.value =
                        `${latitude}, ${longitude}`;


                    locationMessage.innerText =
                        "✅ GPS location captured successfully!";

                }

            }

            catch (error) {

                console.error(error);


                locationInput.value =
                    `${latitude}, ${longitude}`;


                locationMessage.innerText =
                    "⚠️ GPS captured, but address could not be found.";

            }

        },


        function(error) {

            if (error.code === 1) {

                locationMessage.innerText =
                    "❌ Please allow location access.";

            }

            else if (error.code === 2) {

                locationMessage.innerText =
                    "❌ Location information is unavailable.";

            }

            else if (error.code === 3) {

                locationMessage.innerText =
                    "❌ Location request timed out.";

            }

            else {

                locationMessage.innerText =
                    "❌ Unable to get your location.";

            }

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


document
    .getElementById("resourceForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const data = {

                providerName:
                    document.getElementById(
                        "providerName"
                    ).value,

                category:
                    document.getElementById(
                        "category"
                    ).value,

                description:
                    document.getElementById(
                        "description"
                    ).value,

                quantity:
                    document.getElementById(
                        "quantity"
                    ).value,

                location:
                    document.getElementById(
                        "location"
                    ).value,

                latitude:
                    document.getElementById(
                        "latitude"
                    ).value,

                longitude:
                    document.getElementById(
                        "longitude"
                    ).value

            };


            try {

                const response =
                    await fetch(
                        "http://localhost:8083/api/resource",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(data)

                        }
                    );


                const result =
                    await response.text();


                document
                    .getElementById("message")
                    .innerText =
                    result;


                if (response.ok) {

                    document
                        .getElementById(
                            "resourceForm"
                        )
                        .reset();


                    document
                        .getElementById(
                            "locationMessage"
                        )
                        .innerText = "";

                }

            }

            catch (error) {

                document
                    .getElementById("message")
                    .innerText =
                    "Backend server is not running!";

            }

        }
    );

</script>

</body>

</html>
